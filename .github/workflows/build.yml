name: Build NEON SNAKE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: neonsnake-1.0.0
          path: build/libs/neonsnake-*.jar
          if-no-files-found: error
